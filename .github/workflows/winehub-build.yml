name: WINE-HUB Debug APK (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WINE-HUB debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout GASS-OS source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Verify WINE-HUB app identity
        run: |
          grep -q "applicationId 'com.gass.winehub'" app/app/build.gradle
          grep -q 'com.gass.winehub.FileProvider' \
            app/app/src/main/AndroidManifest.xml
          echo "WINE-HUB application identity verified."

      - name: Build debug APK only
        working-directory: app
        run: >-
          bash ./gradlew --no-daemon
          '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WINE-HUB-debug-ARM64
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
